<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sara Ismail Ali – Business Intelligence Analyst">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0B1E"/>
      <stop offset="1" stop-color="#1E1850"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B83F6"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5C542"/>
      <stop offset="1" stop-color="#D4A017"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .m { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .b { transform-box: fill-box; transform-origin: bottom; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .b2 { animation-delay: .12s } .b3 { animation-delay: .24s } .b4 { animation-delay: .36s }
    .b5 { animation-delay: .48s } .b6 { animation-delay: .6s } .b7 { animation-delay: .72s }
    .line { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1.6s .9s ease-out forwards; }
    .dot { opacity: 0; animation: pop .4s 2.3s ease-out forwards; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s 2.6s ease-in-out infinite; }
    .fade { opacity: 0; animation: fade .8s ease-out forwards; }
    .f2 { animation-delay: .2s } .f3 { animation-delay: .4s } .f4 { animation-delay: .6s }
    @keyframes grow { from { transform: scaleY(0) } to { transform: scaleY(1) } }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    @keyframes pop { to { opacity: 1 } }
    @keyframes fade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .55 } 50% { transform: scale(1.9); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .b, .line, .dot, .pulse, .fade { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
    }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="1080" cy="-40" r="260" fill="#8B83F6" opacity=".10"/>
    <circle cx="140" cy="380" r="220" fill="#F5C542" opacity=".05"/>
  </g>

  <!-- Text -->
  <g class="t">
    <text class="m fade" x="64" y="84" fill="#F5C542" font-size="15" font-weight="600" letter-spacing="3">BUSINESS INTELLIGENCE ANALYST</text>
    <text class="fade f2" x="62" y="146" fill="#FFFFFF" font-size="54" font-weight="700" letter-spacing="-1">Sara Ismail Ali</text>
    <text class="fade f3" x="64" y="186" fill="#C9C5F2" font-size="20">Power BI  ·  SQL Server  ·  DAX  ·  Excel  ·  Python</text>
    <g class="fade f4">
      <rect x="64" y="216" width="292" height="38" rx="19" fill="#F5C542" fill-opacity=".12" stroke="#F5C542" stroke-opacity=".55"/>
      <text x="84" y="241" fill="#F5C542" font-size="15" font-weight="600">Microsoft Certified · PL-300</text>
      <rect x="370" y="216" width="232" height="38" rx="19" fill="#8B83F6" fill-opacity=".12" stroke="#8B83F6" stroke-opacity=".55"/>
      <text x="390" y="241" fill="#C9C5F2" font-size="15" font-weight="600">Jeddah, Saudi Arabia</text>
    </g>
  </g>

  <!-- Report card with animated chart -->
  <g transform="translate(720 44)">
    <rect width="420" height="232" rx="16" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
    <line x1="22" y1="206" x2="398" y2="206" stroke="#FFFFFF" stroke-opacity=".15"/>
    <rect class="b"    x="34"  y="150" width="34" height="56"  rx="5" fill="url(#bar)"/>
    <rect class="b b2" x="86"  y="132" width="34" height="74"  rx="5" fill="url(#bar)"/>
    <rect class="b b3" x="138" y="140" width="34" height="66"  rx="5" fill="url(#bar)"/>
    <rect class="b b4" x="190" y="112" width="34" height="94"  rx="5" fill="url(#bar)"/>
    <rect class="b b5" x="242" y="96"  width="34" height="110" rx="5" fill="url(#bar)"/>
    <rect class="b b6" x="294" y="104" width="34" height="102" rx="5" fill="url(#bar)"/>
    <rect class="b b7" x="346" y="70"  width="34" height="136" rx="5" fill="url(#barGold)"/>
    <polyline class="line" points="51,132 103,114 155,120 207,92 259,76 311,82 363,50" fill="none" stroke="#F5C542" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="pulse" cx="363" cy="50" r="6" fill="#F5C542"/>
    <circle class="dot" cx="363" cy="50" r="6" fill="#F5C542" stroke="#0D0B1E" stroke-width="2"/>
  </g>
</svg>
